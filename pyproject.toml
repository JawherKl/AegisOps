[build-system]
requires = ["setuptools==79.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisops"
version = "0.1.0"
description = "A Reproducible Research Testbed for Safe, LLM-Augmented DevOps Automation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aegisops-collect = "aegisops.cli.collect:main"

[tool.setuptools.packages.find]
where = ["src"]