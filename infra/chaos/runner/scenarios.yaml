frontend-pod-kill:
  manifest: chaos/experiments/pod-kill-frontend.yaml
  failure_class: T2.availability.pod-kill
  target_service: frontend
  chaos_resource: PodChaos/frontend-pod-kill
  duration_seconds: 300
  parameters: {mode: one, duration: "5m"}
  expected_symptoms:
    - "frontend pod restarts"
    - "5xx rate spike on frontend"
    - "loadgenerator error rate increases"

frontend-to-cartservice-delay:
  manifest: chaos/experiments/network-delay-frontend-to-cartservice.yaml
  failure_class: T3.communication.network-delay
  target_service: frontend
  chaos_resource: NetworkChaos/frontend-to-cartservice-delay
  duration_seconds: 300
  parameters: {latency: "200ms", direction: to}
  expected_symptoms:
    - "frontend latency increases"
    - "cartservice p99 duration increases"
    - "trace span duration for cartservice calls grows"

productcatalogservice-cpu-stress:
  manifest: chaos/experiments/stress-cpu-productcatalogservice.yaml
  failure_class: T1.resource.stress-cpu
  target_service: productcatalogservice
  chaos_resource: StressChaos/productcatalogservice-cpu-stress
  duration_seconds: 300
  parameters: {workers: 2, load: 80}
  expected_symptoms:
    - "productcatalogservice CPU usage spikes"
    - "productcatalogservice latency increases"
    - "frontend product listing requests slow down"